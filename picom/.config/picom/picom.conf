# picom (v10) — compositor for i3: rounded corners, blur, shadows, fades, inactive opacity.
# Started by the i3 config. Apply changes: `pkill -x picom` then Win+Shift+R.

# ── Rendering ─────────────────────────────────────────────────────────────────
backend = "glx";             # GPU rendering; needed for good blur
vsync = true;                # no tearing
use-damage = true;           # only redraw what changed
unredir-if-possible = true;  # fullscreen video/games bypass the compositor
detect-client-opacity = true;
detect-rounded-corners = true;

# ── Rounded corners (matches dunst/rofi) ──────────────────────────────────────
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",            # i3bar
  "override_redirect = true",        # menus, tooltips, popups (not managed by i3)
  "window_type *= 'menu'",            # menu, popup_menu, dropdown_menu
  "window_type = 'tooltip'",
  "window_type = 'combo'",
  "class_g = 'Dunst'",               # draws its own rounded corners
  "_NET_WM_STATE@[*]:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# ── Shadows ───────────────────────────────────────────────────────────────────
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -8;
shadow-exclude = [
  "window_type = 'dock'",            # i3bar
  "override_redirect = true",        # menus, tooltips, popups (not managed by i3)
  "window_type *= 'menu'",            # menu, popup_menu, dropdown_menu
  "window_type = 'tooltip'",
  "window_type = 'combo'",
  "class_g = 'Dunst'",
  "class_g = 'slop'",                # screenshot area selection
  "_GTK_FRAME_EXTENTS@:c",           # GTK/GNOME apps draw their own shadow
  "_NET_WM_STATE@[*]:32a *= '_NET_WM_STATE_HIDDEN'",
  "_NET_WM_STATE@[*]:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# ── Fading (~0.1 s) ───────────────────────────────────────────────────────────
fading = true;
fade-in-step = 0.1;
fade-out-step = 0.1;
fade-delta = 10;

# ── Opacity ───────────────────────────────────────────────────────────────────
inactive-opacity = 0.95;             # unfocused windows slightly see-through
active-opacity = 1.0;
inactive-opacity-override = false;   # don't override apps that set their own opacity
opacity-rule = [
  "100:_NET_WM_STATE@[*]:32a *= '_NET_WM_STATE_FULLSCREEN'",  # fullscreen always solid
  "100:class_g = 'Rofi'",
  "100:class_g = 'slop'",
  "100:class_g = 'Dunst'",
  "100:window_type = 'dock'",
  "100:override_redirect = true",      # menus, tooltips, popups always solid
  "100:window_type *= 'menu'"
];

# ── Blur (frosted glass behind Alacritty only) ────────────────────────────────
# Only Alacritty is really translucent. Blurring everything also blurs the transparent
# shadow margins that browsers/GTK draw around menus, which shows up as a thick halo.
blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;
blur-background-exclude = [
  "class_g != 'Alacritty'"
];

# ── Per-window-type tweaks ────────────────────────────────────────────────────
wintypes:
{
  tooltip       = { fade = true; shadow = false; opacity = 1.0; focus = true; };
  dock          = { shadow = false; clip-shadow-above = true; };
  dnd           = { shadow = false; };
  menu          = { shadow = false; opacity = 1.0; };
  popup_menu    = { shadow = false; opacity = 1.0; };
  dropdown_menu = { shadow = false; opacity = 1.0; };
  utility       = { shadow = false; };
};
